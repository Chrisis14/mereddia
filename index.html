<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f9" />
    <meta name="description" content="Journey Across Mereddia: a small single-player RPG." />
    <script>
      // Apply saved appearance before first paint so there's no flash.
      try {
        var t = localStorage.getItem("theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.dataset.palette = localStorage.getItem("palette") || "felt";
        root.dataset.font = localStorage.getItem("font") || "oxanium";
      } catch (e) {}
    </script>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Journey Across Mereddia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
